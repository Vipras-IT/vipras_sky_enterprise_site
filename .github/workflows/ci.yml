name: CI Workflow

on:
  push:
    branches:
      - develop # Trigger only on pushes to the develop branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Specify your desired Node.js version

    - name: Install Dependencies
      run: npm install

    - name: Run Prettier
      run: npm run prettier -- --check
      continue-on-error: false # Fail the job if Prettier check fails

    - name: Run Lint
      run: npm run lint
      continue-on-error: false # Fail the job if linting fails

    - name: Run Build
      run: npm run build
      continue-on-error: false # Fail the job if building fails

    - name: Notify via Email on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: 'Build or Lint Failed in CI'
        body: |
          The latest build or linting step failed in your CI workflow.
          Please check the logs for more details.
        to: 'kumar.jkpm@gmail.com'
        from: 'hexbeesoftware@gmail.com'
